<ion-content [fullscreen]="true" class="center">
  <div>
    <div *ngFor="let question of questions" [ngStyle]="{'top': question.top, 'left': question.left}" [id]="question.id"
      class="ethereal-bubble" (cdkDragMoved)="onDragMoved($event)" (cdkDragEnded)="onDragEnded($event, question)"
      #draggable cdkDrag>
      <span class="icon">💡</span>
    </div>
  </div>
  <div class="pendant-wrapper">
    <div class="vine" #stars>
      <div class="star" #star1></div>
      <div class="star" #star3></div>
      <div class="star" #star2></div>
    </div>
  </div>
  <div class="pendant-wrapper" [class.dragging]="dragOver" id="target">
    <div class="pendant" #target></div>
    <div class="progress-container" (click)="triggerProgress()">
      <div class="progress" #progress></div>
    </div>
  </div>
  <button [class.blue]="true" [class.hidden]="!starScreen" class="campaign-btn" type="button" (click)="backToStory()">
    <div class="button-text" style="font-size: 21px;">Continue</div>
  </button>

</ion-content>
